name: release

# Builds the installers of EVIA Paradigma Native with their own Java runtime:
#   Windows 10/11 x64 .exe, macOS .dmg (Apple Silicon and Intel), Ubuntu/Debian .deb, Linux AppImage.
# Each one is smoke-tested by compiling an example to a native executable (and running it on Linux).
# On pushes to main the installers are built and tested (artifacts only).
# Publishing a GitHub release (or pushing a v* tag) attaches them to the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach installers to (e.g. v0.2.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  jar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build with Maven
        run: mvn -B package
      - name: Native executables against the interpreter, and numbers against Java
        run: scripts/check-native.sh
      - name: How big the jar came out
        run: |
          for f in target/evia-paradigma-*.jar; do
            b=$(wc -c < "$f")
            printf 'ASSET SIZE  %-44s %s bytes  %.1f MB\n' "$(basename "$f")" "$b" "$(echo "$b" | awk '{print $1/1048576}')"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/evia-paradigma-*.jar

  package:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022,   kind: windows }
          - { os: macos-15,       kind: macos-arm64 }
          - { os: macos-15-intel, kind: macos-x64 }
          - { os: ubuntu-24.04,   kind: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist/input
      - name: WiX Toolset for the Windows installer
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wix) { choco install wixtoolset -y --no-progress; $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin" | Select-Object -First 1 }
            $wix.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      # From 0.9.0 the installers are online installers: the application and its Java runtime only. The
      # toolchains are packages of the EVIA server (scripts/build-packages.sh, published on dell by the
      # site-dell workflow), picked on the first start and kept up to date from inside the application.
      - name: Build the installer of EVIA Paradigma Native
        run: packaging/package.sh ${{ matrix.kind }}
      - name: How big the installer came out
        shell: bash
        run: |
          # The size each file will have as a release asset, for the download tables in the README
          # and the release notes. MiB to one decimal, which is how GitHub shows an asset.
          for f in packages/*; do
            [ -f "$f" ] || continue
            b=$(wc -c < "$f")
            printf 'ASSET SIZE  %-44s %s bytes  %.1f MB\n' "$(basename "$f")" "$b" "$(echo "$b" | awk '{print $1/1048576}')"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.kind }}
          path: packages/*

  publish:
    needs: [jar, package]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          ls -l assets
          files=(assets/* LICENSE)
          notes="docs/release-notes/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            if [ -f "$notes" ] && [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --title "EVIA Paradigma Native $TAG" --notes-file "$notes"
            fi
          else
            if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
            gh release create "$TAG" "${files[@]}" --title "EVIA Paradigma Native $TAG" "${args[@]}"
          fi
