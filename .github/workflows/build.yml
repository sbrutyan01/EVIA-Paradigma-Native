name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build with Maven
        run: mvn -B package
      - name: The editor, classes, modules, projects and Git
        run: scripts/check-app.sh
      - name: Native executables against the interpreter, and numbers against Java
        run: scripts/check-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: evia-paradigma-native
          path: target/evia-paradigma-native-*.jar
